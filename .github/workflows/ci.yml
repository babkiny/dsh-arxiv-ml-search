name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # tests/plugin.test.js loads index.js against the real defineTool, so the
      # harness dependency has to be present; the lib/ suites need nothing.
      - run: pnpm install --frozen-lockfile
      - run: node --test
